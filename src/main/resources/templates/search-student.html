<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Student | ABiS Student Management System</title>
<link rel="icon" type="images/png" th:href="@{/images/ABiS.png}">

<link rel="stylesheet" th:href="@{/css/style.css}">

<style>

.container{
    width:100%;
    max-width:100%;
    margin:0;
    padding:0 20px;
}

.search-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:30px 0;
}

.search-box{
    position:relative;
    display:flex;
    gap:10px;
    width:100%;
    max-width:680px;
    justify-content:center;
    align-items:stretch;
}

.search-field{
    position:relative;
    flex:1;
}

.search-box input{
    width:100%;
    height:100%;
    padding:12px 14px;
    font-size:16px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.search-box button{
    padding:0 24px;
    background:#3e392e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    flex-shrink:0;
}

.search-box button:hover{
    background:#4b5563;
}

.suggestions{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    list-style:none;
    margin:0;
    padding:6px;
    max-height:280px;
    overflow-y:auto;
    z-index:20;
    display:none;
    text-align:left;
}

.suggestions li{
    padding:9px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.suggestions li:hover,
.suggestions li.active{
    background:#eef2ff;
}

.suggestions .sugg-name{
    font-weight:600;
    color:#111827;
}

.suggestions .sugg-meta{
    font-size:12px;
    color:#6b7280;
    white-space:nowrap;
}

table{
    width:100%;
    table-layout:auto;
    border-collapse:collapse;
    margin-top:20px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:8px 6px;
    text-align:center;
    font-size:13.5px;
    white-space:nowrap;;
}

table th{
    background:#3e392e;
    color:white;
    font-size:13px;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.table-wrapper table{
    min-width:1200px;
    border-collapse:collapse;
}

.action-btn{
    text-decoration:none;
    padding:5px 8px;
    border-radius:4px;
    color:white;
    font-size:12px;
    white-space:nowrap;
}

.actions-cell{
    white-space:nowrap;
    min-width:170px;
}

.actions-row{
    display:flex;
    flex-wrap:nowrap;
    gap:4px;
    justify-content:center;
}

.edit{
    background:#28a745;
}

.delete{
    background:#dc3545;
}

.header{
    background:#3e392e;
    color:white;
    padding:20px;
    text-align:center;
}

.header__brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
}

.header__logo-wrap{
    background:#fff;
    border-radius:8px;
    padding:5px 10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.header__logo{
    height:44px;
    width:auto;
    display:block;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    text-decoration:none;
    background:#6c757d;
    color:white;
    padding:0 18px;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    flex-shrink:0;
}

.back-btn:hover{
    background:#5a6268;
}


@media (max-width:768px){

    .search-box{
        flex-direction:column;
        gap:12px;
    }

    .search-box button,
    .back-btn{
        width:100%;
        justify-content:center;
        height:48px;
    }

    .container{
        padding:15px;
    }
}

@media (max-width:768px){

    .container{
        padding:15px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button,
    .back-btn{
        width:100%;
    }

    .table-wrapper{
        overflow-x:auto;
    }
}

</style>

<link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body>
	
	<header class="topbar">
		    <div class="topbar__inner">
		      <div class="brand">
		        <img th:src="@{/images/ABiS.png}" alt="ABiS Logo" class="brand__logo-img">
		        <div>
		          <p class="brand__name">ABiS Student Management System</p>
		          <p class="brand__sub">Search Student</p>
		        </div>
		      </div>
		      <span class="pill">Academic Year 2026–27</span>
		    </div>
		  </header>

<div class="header">

<div class="header__brand">

</div>

</div>

<div class="container">

<div class="search-wrap">

<form th:action="@{/search}" method="get" id="searchForm" autocomplete="off">

<div class="search-box">

<div class="search-field">

    <input
        type="text"
        id="nameInput"
        name="name"
        placeholder="Enter Student Name"
        th:value="${param.name}">

    <ul class="suggestions" id="suggestions"></ul>

</div>

<button type="submit">
    Search
</button>

<a th:href="@{/}" class="back-btn">Dashboard</a>

</div>

</form>

</div>

<div class="table-wrapper">
<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Age</th>
<th>Course</th>
<th>Email</th>
<th>Phone</th>
<th>Domain</th>
<th>Joining</th>
<th>Completion</th>
<th>College Name</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>

<td th:text="${student.name}"></td>

<td th:text="${student.age}"></td>

<td th:text="${student.course}"></td>

<td th:text="${student.email}"></td>

<td th:text="${student.phone}"></td>

<td th:text="${student.domain}"></td>

<td th:text="${student.joiningDate}"></td>

<td th:text="${student.completionDate}"></td>

<td th:text="${student.collegeName}"></td>

<td class="actions-cell">

<div class="actions-row">

<a
th:href="@{/view/{id}(id=${student.id})}"
class="action-btn"
style="background:#2563eb">
View
</a>

<a
th:href="@{/edit/{id}(id=${student.id})}"
class="action-btn edit">
Edit
</a>

<a
href="#"
th:attr="data-id=${student.id}"
class="action-btn delete"
onclick="return deleteStudent(this)">
Delete
</a>

</div>

</td>

</tr>

<tr th:if="${#lists.isEmpty(students)}">

<td colspan="11">

No Student Found

</td>

</tr>

</tbody>

</table>
</div>

</div>

<script th:inline="javascript">
(function() {
    var input = document.getElementById('nameInput');
    var box = document.getElementById('suggestions');
    var form = document.getElementById('searchForm');
    var suggestionsUrl = /*[[@{/search/suggestions}]]*/ '/search/suggestions';
    var debounceTimer = null;
    var activeIndex = -1;

    function hideSuggestions() {
        box.style.display = 'none';
        box.innerHTML = '';
        activeIndex = -1;
    }

    function renderSuggestions(list) {
        if (!list || list.length === 0) {
            hideSuggestions();
            return;
        }

        box.innerHTML = list.map(function(s) {
            var meta = (s.course || '') + (s.domain ? ' · ' + s.domain : '');
            return '<li data-name="' + s.name.replace(/"/g, '&quot;') + '">' +
                       '<span class="sugg-name"></span>' +
                       '<span class="sugg-meta"></span>' +
                   '</li>';
        }).join('');

        // Fill text content safely (avoids HTML injection from student names)
        var items = box.querySelectorAll('li');
        items.forEach(function(li, i) {
            li.querySelector('.sugg-name').textContent = list[i].name;
            var meta = (list[i].course || '') + (list[i].domain ? ' · ' + list[i].domain : '');
            li.querySelector('.sugg-meta').textContent = meta;
        });

        box.style.display = 'block';
    }

    function fetchSuggestions(query) {
        fetch(suggestionsUrl + '?query=' + encodeURIComponent(query))
            .then(function(res) { return res.ok ? res.json() : []; })
            .then(renderSuggestions)
            .catch(hideSuggestions);
    }

    input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        var query = input.value.trim();

        if (query.length === 0) {
            hideSuggestions();
            return;
        }

        debounceTimer = setTimeout(function() {
            fetchSuggestions(query);
        }, 250);
    });

    box.addEventListener('click', function(e) {
        var li = e.target.closest('li');
        if (!li) return;
        input.value = li.dataset.name;
        hideSuggestions();
        form.submit();
    });

    input.addEventListener('keydown', function(e) {
        var items = box.querySelectorAll('li');
        if (!items.length || box.style.display === 'none') return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
            e.preventDefault();
            input.value = items[activeIndex].dataset.name;
            hideSuggestions();
            form.submit();
            return;
        } else if (e.key === 'Escape') {
            hideSuggestions();
            return;
        } else {
            return;
        }

        items.forEach(function(li, i) {
            li.classList.toggle('active', i === activeIndex);
        });
    });

    document.addEventListener('click', function(e) {
        if (e.target !== input && !box.contains(e.target)) {
            hideSuggestions();
        }
    });
})();
</script>

<div th:replace="~{delete-form :: deleteForm}"></div>
<div th:replace="~{footer :: siteFooter}"></div>

</body>

</html>
