<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | ABiS Student Management System</title>
<link rel="icon" type="images/png" th:href="@{/images/ABiS.png}">

<style>

* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }

body {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:#f5f7fa;
}

main {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card {
    background:#fff;
    width:100%;
    max-width:440px;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,.1);
    padding:34px 30px;
}

h1 { font-size:20px; color:#111827; margin-bottom:6px; }
.sub { font-size:13px; color:#6b7280; margin-bottom:22px; }

label { display:block; font-size:13px; font-weight:600; color:#111827; margin:14px 0 6px; }

input {
    width:100%;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }

.msg { padding:12px 16px; border-radius:8px; margin-bottom:8px; font-size:14px; }
.msg--error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
.msg--ok { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }

.actions { display:flex; gap:10px; margin-top:24px; }

.btn {
    flex:1;
    text-align:center;
    padding:11px 16px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
}

.btn:hover { background:#1d4ed8; }
.btn--ghost { background:#eef2ff; color:#1e3a8a; }
.btn--ghost:hover { background:#dbe4ff; }

</style>
<link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<main>
<div class="card">

    <h1>🔑 Change Password</h1>
    <p class="sub">Use at least 8 characters.</p>

    <div class="msg msg--error" th:if="${error}" th:text="${error}"></div>
    <div class="msg msg--ok" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/change-password}" method="post" autocomplete="off">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}">

        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" name="currentPassword" required>

        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" minlength="8" maxlength="64" required>

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="64" required>

        <div class="actions">
            <button type="submit" class="btn">Update Password</button>
            <a th:href="@{/}" class="btn btn--ghost">Back to Dashboard</a>
        </div>
    </form>

</div>
</main>

<div th:replace="~{footer :: siteFooter}"></div>

</body>
</html>
