spring.application.name=UpdatedABIS

# Database - credentials come from environment variables (see README.md)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ABIS_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Student rules are checked by StudentValidator, not by Hibernate on save
spring.jpa.properties.jakarta.persistence.validation.mode=none

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=true

server.port=8080
# Only this machine by default. Set SERVER_ADDRESS=0.0.0.0 to accept connections from the network. ${SERVER_ADDRESS:127.0.0.1}
server.address=127.0.0.1

# Sessions: cookie only (no session id in URLs), 30 minutes idle timeout
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# First admin account, created only when the admins table is empty.
# If ADMIN_PASSWORD is not set, a random password is printed once in the console.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Photo upload settings (used when adding/editing a student's photo)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
app.upload.dir=uploads/photos

server.forward-headers-strategy=native
# Only your proxy may set the visitor IP. Use 127.0.0.1 if Cloudflare/Tailscale runs on this same PC. 127\\.0\\.0\\.1
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1

spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=false
server.compression.enabled=true
